name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (leave empty to use package.json version)'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    # 日期类函数用例的期望值按东八区断言（沿袭 .travis.yml 的 TZ=Asia/Shanghai）
    env:
      TZ: Asia/Shanghai
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # 有 yarn.lock 用 yarn 安装保证依赖一致；sval、@hecom/aDate 为 git 依赖（公开仓库可直接拉取），
      # @hecom/aDate 同时是 peerDependency，--frozen-lockfile 不影响其解析
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test

      - name: Update version (if specified)
        if: github.event.inputs.version != ''
        run: npm version ${{ github.event.inputs.version }} --no-git-tag-version

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
